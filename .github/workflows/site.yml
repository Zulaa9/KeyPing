name: Web (keyping.zula.dev)

# La web se publica en Cloudflare Pages, que la construye desde site/ en cada push a main.
# Este workflow solo pide a Cloudflare una nueva publicación cuando sale una versión de la app,
# para que los enlaces de descarga apunten a ella, y también recompila el portfolio (zula.dev).
# No toca keyping-ui/ ni las releases.
on:
  release:
    types: [published]
  # Cuando termina el workflow que sube el AppImage, por si la release se publicó antes que sus archivos.
  workflow_run:
    workflows: ['Release Linux']
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Falta el secreto CLOUDFLARE_PAGES_DEPLOY_HOOK (ver site/README.md)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Publicación solicitada a Cloudflare Pages."

      # El portfolio (zula.dev) muestra la versión de KeyPing leída de GitHub al compilar;
      # este hook lo recompila para que la versión nueva aparezca allí también.
      - name: Trigger portfolio deploy hook (zula.dev)
        env:
          HOOK: ${{ secrets.PORTFOLIO_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Falta el secreto PORTFOLIO_DEPLOY_HOOK; zula.dev no se actualiza solo."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Publicación del portfolio solicitada a Cloudflare Pages."
