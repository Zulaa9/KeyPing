name: Web (keyping.zula.dev)

# Construye site/ y la publica en GitHub Pages. Independiente del workflow de release de la app:
# no se dispara con tags ni toca keyping-ui/.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  # Al publicarse una release se reconstruye para que los enlaces de descarga apunten a la nueva.
  # Ojo: estos eventos se ejecutan sobre el tag; el entorno github-pages debe admitir tags v*
  # (site/README.md, paso 2). Si no, el despliegue se rechaza y basta con lanzarlo a mano.
  release:
    types: [published]
  # Cuando termina el workflow que sube el AppImage, por si la release se publicó antes que sus archivos.
  workflow_run:
    workflows: ['Release Linux']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # La web se construye siempre desde main, aunque el disparador sea una release.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          # Solo lectura de la API pública de releases (evita el límite de peticiones anónimas).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Check internal links
        working-directory: site
        run: node scripts/check-links.mjs --offline

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
