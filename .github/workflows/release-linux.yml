name: Release Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: keyping-ui
        run: npm install

      - name: Build AppImage
        working-directory: keyping-ui
        run: |
          npm run build:angular
          npm run electron:build
          npx electron-builder --linux --publish never

      - name: Generate checksums
        working-directory: keyping-ui
        run: bash scripts/generate-checksums.sh

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" keyping-ui/dist/build/KeyPing-*.AppImage --clobber
          gh release upload "$TAG" keyping-ui/dist/build/latest-linux.yml --clobber
          if [ -f "keyping-ui/dist/build/SHA256SUMS.txt" ]; then
            gh release upload "$TAG" keyping-ui/dist/build/SHA256SUMS.txt --clobber
          fi
