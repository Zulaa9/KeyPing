name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release que se va a compilar (por ejemplo, v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # node --test necesita Node 21 o superior para resolver el patrón de los tests.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: keyping-ui
        run: npm ci

      # Electron descarga su binario al primer uso: varios tests a la vez chocarían entre sí.
      - name: Download Electron binary
        working-directory: keyping-ui
        run: node -e "require('electron')"

      - name: Run main-process tests
        working-directory: keyping-ui
        run: npm run test:electron

      - name: Build AppImage
        working-directory: keyping-ui
        run: |
          npm run build:angular
          npm run electron:build
          npx electron-builder --linux --publish never

      - name: Generate checksums
        working-directory: keyping-ui
        run: bash scripts/generate-checksums.sh

      # Metadatos sin firmar: se descargan, se firman en local y se suben a la release a mano.
      - name: Keep unsigned update metadata
        uses: actions/upload-artifact@v4
        with:
          name: latest-linux-unsigned
          path: keyping-ui/dist/build/latest-linux.yml
          retention-days: 14

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" keyping-ui/dist/build/KeyPing-*.AppImage --clobber
          # latest-linux.yml NO se sube aquí: hay que firmarlo fuera de GitHub (docs/RELEASE.md).

          # Conserva las sumas ya publicadas (instalador de Windows) y añade las de Linux.
          SUMS_DIR="$(mktemp -d)"
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$SUMS_DIR" || touch "$SUMS_DIR/SHA256SUMS.txt"
          cat "$SUMS_DIR/SHA256SUMS.txt" keyping-ui/dist/build/SHA256SUMS.txt | sort -u -k2,2 > "$SUMS_DIR/merged.txt"
          mv "$SUMS_DIR/merged.txt" "$SUMS_DIR/SHA256SUMS.txt"
          gh release upload "$TAG" "$SUMS_DIR/SHA256SUMS.txt" --clobber
